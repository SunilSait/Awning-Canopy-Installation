<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — ShadeCraft</title>
    <meta name="description" content="Create your ShadeCraft account to get started with your awning and canopy project, track installations, and access exclusive offers.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="components.js" defer></script>
</head>
<body>
    <div id="auth-topbar-placeholder"></div>

    <main class="auth-page">
        <div class="auth-card">
            <!-- Logo inside card -->
            <a href="index.html" class="auth-card-logo" aria-label="Go to ShadeCraft Home">
                <svg width="42" height="42" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs><linearGradient id="logoBgSignup" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1A3C40"/><stop offset="100%" stop-color="#2D6A5A"/></linearGradient></defs>
                    <rect width="100" height="100" rx="18" fill="url(#logoBgSignup)"/>
                    <path d="M20 55 L50 25 L80 55" stroke="#D4A853" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    <path d="M20 55 L50 45 L80 55" stroke="#D4A853" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
                    <rect x="30" y="55" width="40" height="25" rx="3" fill="none" stroke="white" stroke-width="4"/>
                    <rect x="44" y="62" width="12" height="18" rx="2" fill="white" opacity="0.7"/>
                </svg>
                <span class="nav-logo-text">
                    <span class="brand-top">Awning & Canopy</span>
                    <span class="brand-bottom">ShadeCraft</span>
                </span>
            </a>

            <h1>Create Your Account</h1>
            <p class="auth-subtitle">Join ShadeCraft to manage projects and get exclusive offers</p>

            <form class="auth-form" onsubmit="event.preventDefault(); alert('Account created successfully! Welcome to ShadeCraft.'); window.location.href='index.html';">
                <div class="form-group">
                    <label for="signupFirstName">First Name</label>
                    <input type="text" id="signupFirstName" placeholder="John" required>
                </div>
                <div class="form-group">
                    <label for="signupLastName">Last Name</label>
                    <input type="text" id="signupLastName" placeholder="Smith" required>
                </div>
                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="signupPhone">Phone Number</label>
                    <input type="tel" id="signupPhone" placeholder="(555) 123-4567">
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="signupPassword" placeholder="Create a strong password" required minlength="8">
                        <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="signupConfirmPassword">Confirm Password</label>
                    <div class="password-wrap">
                        <input type="password" id="signupConfirmPassword" placeholder="Re-enter your password" required minlength="8">
                        <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
            </form>

            <div class="auth-divider"><span>or sign up with</span></div>

            <div class="social-login-btns">
                <button type="button" class="social-btn" onclick="alert('Google sign-up coming soon!');">
                    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.9 33.5 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.2-2.7-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.5 18.8 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.8-3.5-11.3-8.3l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.2-2.7-.4-3.9z"/></svg>
                    Sign up with Google
                </button>
                <button type="button" class="social-btn" onclick="alert('Apple sign-up coming soon!');">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.32 2.32-1.96 4.41-3.74 4.25z"/></svg>
                    Sign up with Apple
                </button>
                <button type="button" class="social-btn" onclick="alert('Facebook sign-up coming soon!');">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07c0 6.02 4.39 11.02 10.13 11.93v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.69.24 2.69.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8v8.44C19.61 23.09 24 18.09 24 12.07z"/></svg>
                    Sign up with Facebook
                </button>
            </div>

            <p class="auth-footer-text">Already have an account? <a href="login.html">Sign In</a></p>
        </div>
    </main>
</body>
</html>
